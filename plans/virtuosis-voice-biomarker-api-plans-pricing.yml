billing_model:
  confirmed: true
  type: credit-metered subscription
  source: https://docs.virtuosis.ai/api-reference/usage/get-recordings-usage
  evidence: >-
    The API itself proves the commercial model even though the prices are unpublished. GET
    /usage/recordings returns a `tier` string plus three credit buckets - trial (one-time, granted
    allotment), included (monthly, resets each billing cycle) and purchased (credit packs that roll
    over until used or refunded). So there ARE named subscription tiers with per-tier monthly
    allotments; the names, allotments and prices are simply not public.
  faq_statement: >-
    The homepage FAQ states: "We offer flexible monthly and annual plans based on the required volume.
    Billing can be arranged directly with us or through one of our partners, such as Microsoft." It also
    states a demo can include "a free trial code for the web app or a couple of API credits." Volume-based
    negotiated pricing with no published rate card.
  faq_source: https://www.virtuosis.ai/#FAQ
  billing_periods:
