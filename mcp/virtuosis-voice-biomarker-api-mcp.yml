coverage:
  wraps_rest_api: false
  note: >-
    IMPORTANT SCOPE LIMIT. This is a Fern documentation MCP server, not an API MCP server. Its single
    tool searches the docs corpus; it does NOT expose createAccount, uploadRecording,
    getRecordingAnalysis, getRecordingsUsage or ping as callable tools. An agent connected to this
    server can read how to use the Virtuosis API but cannot call it. Recorded here because the
    endpoint is genuinely hosted, anonymous, and reachable - not because it fronts the biomarker API.
