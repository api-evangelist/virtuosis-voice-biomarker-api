finding: >-
  Virtuosis ships NO client libraries in any language. Integration is raw HTTP against
  https://api.virtuosis.ai/v1.3 with a bearer token and Base64 audio in a JSON body. Because the
  provider publishes a clean OpenAPI 3.1.0 with operationIds on every operation, a generated client is
  a small, mechanical piece of work that would remove the largest ergonomics gap in this profile -
  particularly the Base64 encoding, the poll loop, and the credit-exhaustion vs rate-limit distinction
  a hand-rolled client will get wrong.
