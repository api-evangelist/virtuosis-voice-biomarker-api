aid: virtuosis-voice-biomarker-api
name: Virtuosis Voice Biomarker API
description: REST API from Virtuosis AI (an EPFL spinoff) providing AI-based voice biomarker analysis
  that detects health disorders from short audio recordings. Analysis families include Wellbeing (stress,
  anxiety, depression), Parkinson's, Alzheimer's/MCI, and Communication Coach. Delivered as CE-marked
  software as a medical device with Bearer-token authentication.
