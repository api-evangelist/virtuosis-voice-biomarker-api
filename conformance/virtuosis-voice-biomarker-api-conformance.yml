    evidence: No OAuth flows. /.well-known/oauth-authorization-server 404s on every host.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration 404s on every host.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use a vendor {error:{type,message}} envelope with application/json, not
