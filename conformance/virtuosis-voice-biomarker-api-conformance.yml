  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt 404s on api.virtuosis.ai, docs.virtuosis.ai and www.virtuosis.ai.
  - id: rfc8594-sunset
    conforms: false
    evidence: No Sunset or Deprecation header observed on live v1.2 or v1.3 responses.
  - id: a2a-agent-card
    conforms: false
    evidence: >-
      /.well-known/agent-card.json and /.well-known/agent.json 404 on all four hosts.
  - id: asyncapi
    conforms: false
    evidence: No event, streaming or webhook surface exists - the API is submit-then-poll only.
  - id: fhir
    conforms: false
    evidence: >-
      Not applicable in the shipped contract. Virtuosis returns proprietary voice-biomarker JSON
      (WellbeingInsights, ParkinsonsInsights, AlzheimersInsights, CommunicationCoachInsights) rather
      than FHIR resources such as Observation, and no FHIR mapping is published. Worth noting because
      the product targets healthcare integrators who will usually need one.
