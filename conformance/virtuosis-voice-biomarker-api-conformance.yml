technical_standards:
  - id: openapi-3.1
    conforms: true
    evidence: >-
      Two OpenAPI 3.1.0 documents are published and machine-fetchable (v1.3 and v1.2), both parse, both
      declare servers[], operationIds, tags, summaries, descriptions, 2xx and 4xx/5xx responses, request
      and response examples, reusable components.schemas and a securityScheme.
    source: https://docs.virtuosis.ai/openapi/api-reference.json
  - id: rfc9727-api-catalog
    conforms: true
    evidence: >-
      docs.virtuosis.ai serves /.well-known/api-catalog as application/linkset+json with
      profile="https://www.rfc-editor.org/info/rfc9727", carrying service-desc and service-doc links for
      both API versions. Verified HTTP 200 on 2026-08-18.
    source: https://docs.virtuosis.ai/.well-known/api-catalog
  - id: mcp-2025-06-18
    conforms: true
    evidence: >-
      A hosted streamable-http MCP server at https://docs.virtuosis.ai/_mcp/server completed
      initialize (protocolVersion 2025-06-18, serverInfo fern-docs-mcp-server 1.0.0) and returned a
      real tools/list anonymously. Scope is documentation search only, not the REST API.
    source: https://docs.virtuosis.ai/_mcp/server
  - id: llms-txt
    conforms: true
    evidence: >-
      /llms.txt is served at the docs root and per-version (/v-1-3/llms.txt, /v-1-2/llms.txt), listing
      every doc page with .md twins plus the OpenAPI exports.
    source: https://docs.virtuosis.ai/llms.txt
  - id: rfc6750-bearer
    conforms: true
    evidence: 'All operations require Authorization: Bearer <API_KEY>; OpenAPI declares http/bearer.'
  - id: oauth2
