regulatory_and_compliance:
  note: >-
    Claims published by Virtuosis on its own Ethics & Privacy page and DPA. Recorded as PUBLISHED
    CLAIMS - certificate numbers, audit reports and scope statements are not made available publicly,
    and no third-party attestation could be independently verified from the public surface.
  claims:
    - id: ce-mark-samd
      claim: CE-marked software as a medical device
      published: true
      evidence: >-
        The API product page states that medical insights are released only after manual validation by
        Virtuosis "in accordance with the intended purpose of its CE-marked software as a medical
        device", and the docs Guidelines page requires client applications to carry legal manufacturer
        information and offers CE marking documentation on request.
      source: https://docs.virtuosis.ai/guidelines
      independently_verified: false
      note: >-
        The CE certificate, notified body and UDI are not published. Virtuosis states developers should
        request CE marking documentation when required for deployment, procurement or compliance.
    - id: gdpr
      claim: GDPR compliant
      published: true
      evidence: >-
        Ethics & Privacy page asserts GDPR compliance; a full Data Processing Addendum is published
        naming Virtuosis Artificial Intelligence SA as Processor, with breach notification without
        undue delay, sub-processor terms, an annual audit right, and Appendix B technical and
        organizational measures.
      source: https://www.virtuosis.ai/dpa
    - id: fadp
      claim: Swiss Federal Act on Data Protection
      published: true
      evidence: The DPA names the FADP alongside the GDPR in its Applicable Data Protection Laws definition.
      source: https://www.virtuosis.ai/dpa
    - id: hipaa
      claim: HIPAA compliant
      published: true
      evidence: >-
        Ethics & Privacy page claims HIPAA compliance and states in-region server deployment can be
        supported on request for HIPAA or PIPEDA requirements.
      source: https://www.virtuosis.ai/ethics-privacy
      independently_verified: false
      note: No BAA is published or offered on the public surface.
    - id: iso-27001
      claim: ISO/IEC 27001 certified infrastructure
      published: true
      evidence: >-
        Ethics & Privacy page states data is stored "within infrastructure certified to ISO/IEC 27001
        standards" under the heading "Certified servers".
      source: https://www.virtuosis.ai/ethics-privacy
      independently_verified: false
      note: >-
        Read this claim precisely - it is scoped to the SERVERS/infrastructure, not to a Virtuosis
        ISMS certificate. No certificate number or certification body is named.
    - id: hds
      claim: HDS (Hebergeur de Donnees de Sante) requirements
      published: true
      evidence: >-
        Ethics & Privacy page states data is stored on European servers "designed to meet GDPR and HDS
        requirements".
      source: https://www.virtuosis.ai/ethics-privacy
      independently_verified: false
      note: Stated as "designed to meet", which is weaker than an HDS certification claim.
    - id: soc2
      claim: null
      published: false
      evidence: No SOC 2 claim appears anywhere on the public surface.
    - id: pci-dss
      claim: null
      published: false
      evidence: Not applicable - no cardholder data is handled by this API.
    - id: fedramp
      claim: null
      published: false
  data_handling:
    residency: European servers by default; in-region deployment available on request.
    encryption: TLS in transit, AES-256 at rest "where applicable"
    controls: role-based least-privilege access, audit logging, data minimization, pseudonymization/de-identification where possible
    subject_rights: users can access or permanently delete their data at any time
    sub_processors:
      published: false
      obtainable: true
      contact: privacy@virtuosis.ch
      note: Appendix A of the DPA says the current sub-processor list is available on request, not published.
    source: https://www.virtuosis.ai/ethics-privacy
  clinical:
    validation_page: https://www.virtuosis.ai/clinical-validation
    mandatory_ui_disclaimer: >-
      Not intended to provide a medical diagnosis or to replace clinical judgment. Outputs are for
      clinical decision support and must be interpreted by a qualified healthcare professional.
    source: https://docs.virtuosis.ai/guidelines
