entities:
  - name: Organisation
    implicit: true
    identified_by: the API key itself
    note: >-
      Never returned as a resource and has no endpoint, but it is the real tenancy root - accounts,
      credits, tier and analysis entitlements all hang off the organisation that owns the bearer token.
    fields_observed_elsewhere:
      - CreateAccountResponse.organisation_role
      - RecordingsUsageResponse.tier
  - name: Account
    schema: CreateAccountResponse
    id_field: account_id (uuid)
    created_by: createAccount (POST /accounts)
    fields:
      - account_id
      - organisation_role
    enums:
      organisation_role: CreateAccountResponseOrganisationRole (always "speaker")
    note: One account per end user, always assigned the speaker role.
  - name: Recording
    schema: UploadRecordingResponse
    id_field: recording_id (uuid)
    created_by: uploadRecording (POST /recordings)
    fields:
      - recording_id
      - account_id
      - recorded_at
      - uploaded_at
      - audio_file_format
      - audio_size_bytes
      - audio_sample_rate_hz
      - audio_bit_rate_bps
      - audio_duration_seconds
      - speech_duration_seconds
  - name: RecordingAnalysis
    schema: RecordingAnalysis / RecordingAnalysisResponse
    read_by: getRecordingAnalysis (GET /recordings/{recording_id}/analysis)
    note: >-
      Not independently addressable - it is the projection of a Recording once processing completes.
      Carries a RecordingAnalysisMetadata block plus up to four analysis family objects.
  - name: WellbeingAnalysis
    schema: WellbeingAnalysis -> WellbeingInsights -> {StressInsight, AnxietyInsight, DepressionInsight}
    status_enum: AnalysisStatus
    ratings:
      stress: StressInsightRating (low, moderate, high)
      anxiety: AnxietyInsightRating (minimal, mild, moderate, severe)
      depression: DepressionInsightRating (minimal, moderate, severe)
  - name: ParkinsonsAnalysis
    schema: ParkinsonsAnalysis -> ParkinsonsInsights -> ParkinsonsInsight + ParkinsonsIndicators
    access: gated - released only after manual validation by Virtuosis
  - name: AlzheimersAnalysis
    schema: AlzheimersAnalysis -> AlzheimersInsights -> {CognitionInsight, CognitionScores} + AlzheimersIndicators
    access: gated - released only after manual validation by Virtuosis
  - name: CommunicationCoachAnalysis
    schema: CommunicationCoachAnalysis -> CommunicationCoachInsights -> CommunicationCoachInsight + CommunicationCoachIndicators
    note: New in v1.3; has no counterpart in the v1.2 contract.
  - name: RecordingsUsage
    schema: RecordingsUsageResponse
    read_by: getRecordingsUsage (GET /usage/recordings)
    scope: organisation
    fields:
      - trial_remaining
      - trial_granted
      - included_remaining
      - included_granted
      - purchased_remaining
      - tier
